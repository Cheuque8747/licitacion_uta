version: '3.8'

# ==============================================================================
# Orquestación Clúster Docker Swarm - Sistema Licitaciones UTA
# Opción 3: Despliegue en 5 Máquinas Virtuales con Red Overlay y Réplicas
# ==============================================================================

networks:
  uta_overlay:
    driver: overlay
    attachable: true

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  portainer_data:
    driver: local

services:
  # ============================================================================
  # 1. GATEWAY PERIMETRAL (Nginx Proxy Inverso en VM1)
  # ============================================================================
  gateway:
    image: ${REGISTRY:-10.0.0.1:5000}/licitacion-uta-gateway:1.0.0
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 5432
        published: 5432
        mode: host
    networks:
      - uta_overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Corre en VM1
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 2. MICROSERVICIO 1: FRONTEND (Web UI balanceada en VM2 y VM3)
  # ============================================================================
  frontend:
    image: ${REGISTRY:-10.0.0.1:5000}/licitacion-uta-frontend:1.0.0
    networks:
      - uta_overlay
    deploy:
      replicas: 2 # 2 instancias automáticas distribuidas entre VM2 y VM3
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 3. MICROSERVICIO 2: BACKEND CORE (API & WebSockets balanceada en VM2 y VM3)
  # ============================================================================
  backend-core:
    image: ${REGISTRY:-10.0.0.1:5000}/licitacion-uta-backend-core:1.0.0
    environment:
      - PORT=3000
      - DB_USER=${DB_USER:-admin_proyecto}
      - DB_HOST=postgres-db
      - DB_NAME=${DB_NAME:-db_licitacion}
      - DB_PASSWORD=${DB_PASSWORD:-12345}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_uta_2024}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-tu_contrasena_redis}
      - IA_SERVICE_URL=http://ia-service:5000
    networks:
      - uta_overlay
    deploy:
      replicas: 2 # 2 instancias automáticas distribuidas entre VM2 y VM3
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 4. MICROSERVICIO 3: INTELIGENCIA ARTIFICIAL (Gemini balanceada en VM2 y VM3)
  # ============================================================================
  ia-service:
    image: ${REGISTRY:-10.0.0.1:5000}/licitacion-uta-ia-service:1.0.0
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - uta_overlay
    deploy:
      replicas: 2 # 2 instancias automáticas distribuidas entre VM2 y VM3
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s

  # ============================================================================
  # 5. CACHÉ Y MENSAJERÍA: REDIS (Anclado a VM1)
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-tu_contrasena_redis}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - uta_overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Anclado a VM1
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 6. CAPA DE PERSISTENCIA: POSTGRESQL MASTER (Anclado a VM4)
  # ============================================================================
  postgres-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-admin_proyecto}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12345}
      - POSTGRES_DB=${DB_NAME:-db_licitacion}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - uta_overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.app == db # Garantiza ejecución exclusiva en VM4
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 7. OBSERVABILIDAD Y MONITOREO: PORTAINER (Anclado a VM1)
  # ============================================================================
  portainer:
    image: portainer/portainer-ce:2.27.1-alpine
    ports:
      - target: 9000
        published: 9000
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - uta_overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Anclado a VM1
      restart_policy:
        condition: on-failure
