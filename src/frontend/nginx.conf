server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Evitar redirecciones con URL absoluta sin puerto
    absolute_redirect off;
    port_in_redirect off;

    # Healthcheck para Docker Compose
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redireccion de raiz a inicio de sesion
    location = / {
        return 302 /login;
    }

    # Rutas amigables para vistas HTML
    location = /login {
        try_files /views/login.html =404;
    }

    location = /register {
        try_files /views/register.html =404;
    }

    location = /dashboard {
        try_files /views/dashboard.html =404;
    }

    location = /perfil {
        try_files /views/perfil.html =404;
    }

    location = /vacantes {
        try_files /views/vacantes.html =404;
    }

    location = /postular {
        try_files /views/postular.html =404;
    }

    location = /mis-postulaciones {
        try_files /views/mis_postulaciones.html =404;
    }

    location = /gestion-postulantes {
        try_files /views/gestion_postulantes.html =404;
    }

    location = /admin/users {
        try_files /views/admin_users.html =404;
    }

    location = /admin/analytics {
        try_files /views/admin_analytics.html =404;
    }

    # Recursos estaticos (CSS, JS, Imagenes)
    location / {
        try_files /public$uri $uri =404;
    }
}
