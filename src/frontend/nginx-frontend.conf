server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index views/login.html index.html;

    # Redirigir la raíz al login
    location = / {
        return 302 /login;
    }

    # Rutas limpias para las vistas del frontend
    location = /login {
        try_files /views/login.html =404;
    }

    location = /register {
        try_files /views/register.html =404;
    }

    location = /dashboard {
        try_files /views/dashboard.html =404;
    }

    location = /perfil {
        try_files /views/perfil.html =404;
    }

    location = /vacantes {
        try_files /views/vacantes.html =404;
    }

    location = /postular {
        try_files /views/postular.html =404;
    }

    location = /mis-postulaciones {
        try_files /views/mis_postulaciones.html =404;
    }

    location = /gestion-postulantes {
        try_files /views/gestion_postulantes.html =404;
    }

    location = /admin/users {
        try_files /views/admin_users.html =404;
    }

    location = /admin/analytics {
        try_files /views/admin_analytics.html =404;
    }

    # Archivos estáticos (JS, CSS, imágenes)
    location / {
        try_files $uri $uri/ /views/login.html =404;
    }

    # Cache para estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
