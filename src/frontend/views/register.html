<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Sistema de Licitaciones</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 py-5">
    
    <div class="card shadow-sm p-4 border-0" style="width: 100%; max-width: 500px; border-radius: 1rem;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="/Vertical.jpg" alt="Logo UTA" class="logo-header">
            </div>
            <h2 class="fw-bold">Crear Cuenta</h2>
            <p class="text-muted">Únete a la plataforma de licitaciones</p>
        </div>
        
        <div id="alert-box" class="alert d-none" role="alert"></div>

        <form id="register-form">
            
            <div class="mb-4 text-center role-selector">
                <label class="form-label fw-semibold d-block mb-3">¿Cómo deseas registrarte?</label>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="rol" id="rol-postulante" value="postulante" autocomplete="off" checked onchange="toggleRole()">
                    <label class="btn btn-outline-primary py-2" for="rol-postulante"><i class="bi bi-person-badge me-2"></i>Postulante</label>
                  
                    <input type="radio" class="btn-check" name="rol" id="rol-reclutador" value="reclutador" autocomplete="off" onchange="toggleRole()">
                    <label class="btn btn-outline-primary py-2" for="rol-reclutador"><i class="bi bi-building me-2"></i>Reclutador</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="rut" class="form-label fw-semibold">RUT Personal</label>
                <input type="text" id="rut" class="form-control" placeholder="12.345.678-9" pattern="^[0-9\\.]+-[0-9kK]$" title="Ej: 12.345.678-9 o 12345678-9" required>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="mb-4 d-none p-3 bg-white border rounded shadow-sm" id="empresa-container">
                <label for="empresa_id" class="form-label fw-semibold text-primary"><i class="bi bi-building-check me-2"></i>Selecciona tu Empresa</label>
                <select id="empresa_id" class="form-select border-primary">
                    <option value="">Cargando empresas...</option>
                </select>
                <small class="text-muted d-block mt-2"><i class="bi bi-info-circle me-1"></i>Si tu empresa no está en la lista, contacta al administrador para que la registre.</small>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase mt-2 shadow-sm">Completar Registro</button>
        </form>
        
        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted">¿Ya tienes cuenta?</span> <a href="/login" class="text-decoration-none fw-bold ms-1">Inicia sesión</a>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadEmpresas();
            toggleRole();
        });

        function toggleRole() {
            const isReclutador = document.getElementById('rol-reclutador').checked;
            const container = document.getElementById('empresa-container');
            const select = document.getElementById('empresa_id');
            
            if (isReclutador) {
                container.classList.remove('d-none');
                select.required = true;
            } else {
                container.classList.add('d-none');
                select.required = false;
            }
        }

        async function loadEmpresas() {
            try {
                const res = await fetch('/api/admin/empresas');
                const data = await res.json();
                if (data.success) {
                    const select = document.getElementById('empresa_id');
                    select.innerHTML = '<option value="">Selecciona tu empresa...</option>';
                    data.data.forEach(e => {
                        select.innerHTML += '<option value="' + e.id + '">' + e.nombre_empresa + ' (' + e.rut_empresa + ')</option>';
                    });
                }
            } catch(e) { console.error('Error cargando empresas'); }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rut = document.getElementById('rut').value;
            const nombre_completo = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rol = document.getElementById('rol-postulante').checked ? 'postulante' : 'reclutador';
            const empresa_id = document.getElementById('empresa_id').value;
            
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rut, nombre_completo, email, password, rol, empresa_id })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.textContent = '¡Cuenta creada exitosamente! Redirigiendo...';
                    alertBox.className = 'alert alert-success';
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    alertBox.textContent = data.error;
                    alertBox.className = 'alert alert-danger';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Completar Registro';
                }
            } catch (err) {
                alertBox.textContent = 'Error de conexión con el servidor.';
                alertBox.className = 'alert alert-danger';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Completar Registro';
            }
        });
    </script>
</body>
</html>
