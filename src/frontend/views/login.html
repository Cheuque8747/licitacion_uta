<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Licitaciones</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    
    <div class="card shadow-sm p-4 border-0" style="width: 100%; max-width: 400px; border-radius: 1rem;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="/Vertical.jpg" alt="Logo UTA" class="logo-header">
            </div>
            <h2 class="fw-bold">Iniciar Sesión</h2>
            <p class="text-muted">Ingresa a tu cuenta para continuar</p>
        </div>
        
        <div id="alert-box" class="alert d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar</button>
        </form>
        
        <div class="text-center mt-3">
            <small class="text-muted">¿No tienes cuenta? <a href="/register" class="text-decoration-none">Regístrate aquí</a></small>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.add('d-none'); // Ocultar alerta inicial

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.error;
                    alertBox.className = 'alert alert-danger';
                }
            } catch (err) {
                alertBox.textContent = 'Error de conexión con el servidor.';
                alertBox.className = 'alert alert-danger';
            }
        });
    </script>
</body>
</html>
