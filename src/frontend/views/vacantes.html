<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacantes - Sistema de Licitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { padding-top: 70px; background-color: #f8fafc; }
        .oferta-card { transition: transform 0.2s, box-shadow 0.2s; border-radius: 10px; border-left: 5px solid var(--uta-primary-dark); }
        .oferta-card:hover { transform: translateY(-3px); box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    

    <div class="container py-4">
        <!-- Panel superior: Título y Filtros / Botón Crear -->
        <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-1" id="page-title">Ofertas Laborales</h2>
                <p class="text-muted mb-0" id="page-subtitle">Explora las vacantes disponibles para tu carrera.</p>
            </div>
            
            <div id="reclutador-actions" class="d-none">
                <button class="btn btn-primary fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#createOfertaModal">
                    <i class="bi bi-plus-circle me-1"></i>Publicar Vacante
                </button>
            </div>
        </div>

        <!-- Filtros para postulante y reclutador -->
        <div class="card shadow-sm border-0 mb-4 d-none" id="filters-card">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-2" id="view-mode-container" style="display: none;">
                        <label class="form-label fw-semibold text-secondary">Ver Ofertas</label>
                        <select class="form-select" id="view-mode" onchange="loadOfertas()">
                            <option value="mis_ofertas">Mis Ofertas</option>
                            <option value="mi_empresa">Mi Empresa</option>
                            <option value="todas">Todas</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="tipo-filter-container">
                        <label class="form-label fw-semibold text-secondary">Tipo</label>
                        <select class="form-select" id="filter-tipo" onchange="loadOfertas()">
                            <option value="">Cualquier tipo</option>
                            <option value="empleo">Empleo</option>
                            <option value="practica">Práctica</option>
                            <option value="pasantia">Pasantía</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="facultad-filter-container">
                        <label class="form-label fw-semibold text-secondary">Facultad</label>
                        <select class="form-select" id="filter-facultad" onchange="updateFilterCarreras()">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="carrera-filter-container">
                        <label class="form-label fw-semibold text-secondary">Carrera</label>
                        <select class="form-select" id="filter-carrera">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-primary w-100 fw-bold" onclick="loadOfertas()">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Ofertas -->
        <div id="ofertas-container" class="row g-4">
            <!-- Las ofertas se cargan aquí -->
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Cargando vacantes...</p>
            </div>
        </div>
    </div>

    <!-- Modal para Crear Oferta (Reclutadores) -->
    <div class="modal fade" id="createOfertaModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-file-earmark-plus me-2"></i>Nueva Vacante</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="create-oferta-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Título de la Vacante</label>
                            <input type="text" class="form-control" id="new-titulo" placeholder="Ej. Ingeniero de Software Junior" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo de Oferta</label>
                            <select class="form-select" id="new-tipo" required>
                                <option value="empleo">Empleo (Contrato)</option>
                                <option value="practica">Práctica Profesional</option>
                                <option value="pasantia">Pasantía</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Facultad Objetivo (Solo 1)</label>
                                <select class="form-select" id="new-facultad" onchange="updateNewCarreras()" required>
                                    <option value="">Selecciona Facultad...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Carreras (Múltiples)</label>
                                <select multiple class="form-select" id="new-carrera" required style="height: 100px;">
                                    <option value="" disabled>Primero selecciona Facultad...</option>
                                </select>
                                <small class="text-muted">Presiona Ctrl/Cmd para seleccionar varias.</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción del Cargo</label>
                            <textarea class="form-control" id="new-descripcion" rows="4" placeholder="Detalla las responsabilidades, requisitos y beneficios..." required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Experiencia Solicitada</label>
                                <textarea class="form-control" id="new-experiencia" rows="3" placeholder="Ej: 2 años manejando proyectos..." required></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Habilidades Requeridas</label>
                                <textarea class="form-control" id="new-habilidades" rows="3" placeholder="Ej: Python, SQL, Trabajo en equipo..." required></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary fw-bold" onclick="submitOferta()">Publicar Vacante</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ver Detalles (Para Postulantes) -->
    <div class="modal fade" id="ofertaDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="detail-title">Cargando...</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="text-muted mb-1">Empresa</p>
                            <h5 class="fw-semibold" id="detail-empresa">...</h5>
                        </div>
                        <div class="col-md-6">
                            <p class="text-muted mb-1">Publicado por</p>
                            <h6 class="fw-medium" id="detail-reclutador">...</h6>
                        </div>
                    </div>
                    <div class="mb-3">
                        <p class="text-muted mb-1">Requisitos Mínimos</p>
                        <div>
                            <span class="badge bg-light text-dark border border-secondary me-1" id="detail-facultad"></span>
                            <span id="detail-carreras-container"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="text-muted mb-1">Experiencia</p>
                            <p id="detail-experiencia" style="white-space: pre-wrap; font-size: 0.95rem;"></p>
                        </div>
                        <div class="col-md-6">
                            <p class="text-muted mb-1">Habilidades</p>
                            <p id="detail-habilidades" style="white-space: pre-wrap; font-size: 0.95rem;"></p>
                        </div>
                    </div>
                    <div>
                        <p class="text-muted mb-1">Descripción Breve</p>
                        <p id="detail-descripcion" style="white-space: pre-wrap;"></p>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-success fw-bold" id="btn-ir-postular">Ir a Postular <i class="bi bi-arrow-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const userData = localStorage.getItem('user');
        if (!userData) window.location.href = '/login';
        const user = JSON.parse(userData);

        const facultadesData = {
            'Facultad de Ingeniería': ['Ingeniería Civil Informática', 'Ingeniería Civil Industrial', 'Ingeniería Civil Eléctrica', 'Ingeniería Mecánica'],
            'Facultad de Ciencias': ['Licenciatura en Matemática', 'Licenciatura en Física', 'Biología', 'Química'],
            'Facultad de Administración y Economía': ['Ingeniería Comercial', 'Ingeniería en Información y Control de Gestión', 'Contador Auditor'],
            'Facultad de Ciencias Sociales y Jurídicas': ['Derecho', 'Psicología', 'Trabajo Social'],
            'Facultad de Ciencias Agronómicas': ['Agronomía']
        };

        document.addEventListener('DOMContentLoaded', () => {
            initUI();
            loadOfertas();
        });

        function initUI() {
            // Llenar selects de facultades
            const facOptions = '<option value="">Todas / Selecciona...</option>' + 
                               Object.keys(facultadesData).map(f => `<option value="${f}">${f}</option>`).join('');
            
            document.getElementById('filters-card').classList.remove('d-none');
            document.getElementById('filter-facultad').innerHTML = facOptions;

            if(user.rol === 'postulante') {
                document.getElementById('tipo-filter-container').className = 'col-md-3';
                document.getElementById('facultad-filter-container').className = 'col-md-4';
                document.getElementById('carrera-filter-container').className = 'col-md-4';
                document.getElementById('view-mode-container').style.display = 'none';
            } else if (user.rol === 'reclutador') {
                document.getElementById('page-title').textContent = 'Panel de Vacantes';
                document.getElementById('page-subtitle').textContent = 'Gestiona y explora las ofertas laborales.';
                document.getElementById('reclutador-actions').classList.remove('d-none');
                document.getElementById('new-facultad').innerHTML = facOptions;
                document.getElementById('view-mode-container').style.display = 'block';
            } else {
                document.getElementById('page-subtitle').textContent = 'Panel de vista general de vacantes.';
            }
        }

        function updateFilterCarreras() {
            const fac = document.getElementById('filter-facultad').value;
            const carSelect = document.getElementById('filter-carrera');
            if (!fac) {
                carSelect.innerHTML = '<option value="">Todas las carreras</option>';
                return;
            }
            carSelect.innerHTML = '<option value="">Todas las carreras</option>' + 
                                  facultadesData[fac].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function updateNewCarreras() {
            const fac = document.getElementById('new-facultad').value;
            const carSelect = document.getElementById('new-carrera');
            if (!fac) {
                carSelect.innerHTML = '<option value="">Primero selecciona Facultad...</option>';
                return;
            }
            carSelect.innerHTML = '<option value="">Cualquier Carrera / Selecciona...</option>' + 
                                  facultadesData[fac].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        async function loadOfertas() {
            const container = document.getElementById('ofertas-container');
            container.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border text-primary" role="status"></div><p>Cargando...</p></div>';

            try {
                let url = '/api/ofertas?';
                
                const fac = document.getElementById('filter-facultad').value;
                const car = document.getElementById('filter-carrera').value;
                const tipo = document.getElementById('filter-tipo').value;
                if (fac) url += `facultad=${encodeURIComponent(fac)}&`;
                if (car) url += `carrera=${encodeURIComponent(car)}&`;
                if (tipo) url += `tipo=${encodeURIComponent(tipo)}&`;

                if (user.rol === 'reclutador') {
                    const viewMode = document.getElementById('view-mode').value;
                    url += `reclutador_id=${user.id}&view_mode=${viewMode}&`;
                }

                const res = await fetch(url);
                const data = await res.json();
                
                if (data.success) {
                    renderOfertas(data.data);
                } else {
                    container.innerHTML = '<div class="col-12"><div class="alert alert-danger">Error al cargar ofertas.</div></div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="col-12"><div class="alert alert-danger">Falla de conexión.</div></div>';
            }
        }

        function renderOfertas(ofertas) {
            const container = document.getElementById('ofertas-container');
            if (ofertas.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-folder2-open text-muted" style="font-size: 4rem;"></i>
                        <h4 class="mt-3 text-muted">No hay ofertas disponibles.</h4>
                    </div>`;
                return;
            }

            let html = '';
            ofertas.forEach(o => {
                const badgeColor = o.tipo === 'practica' ? 'bg-info text-dark' : (o.tipo === 'empleo' ? 'bg-success' : 'bg-warning text-dark');
                const date = new Date(o.fecha_creacion).toLocaleDateString('es-CL');
                html += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card bg-white shadow-sm h-100 oferta-card p-3">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge ${badgeColor} text-uppercase">${o.tipo}</span>
                                    <small class="text-muted"><i class="bi bi-calendar3 me-1"></i>${date}</small>
                                </div>
                                <h5 class="card-title fw-bold text-primary mb-1">${o.titulo}</h5>
                                <h6 class="card-subtitle text-muted mb-3"><i class="bi bi-building me-1"></i>${o.nombre_empresa}</h6>
                                
                                <div class="mb-3">
                                    <span class="badge bg-light text-dark border border-secondary mb-1"><i class="bi bi-mortarboard-fill me-1"></i>${o.facultad_requerida || 'Todas'}</span>
                                    ${(o.carrera_requerida || []).map(c => `<span class="badge bg-light text-dark border border-secondary me-1"><i class="bi bi-book-fill me-1"></i>${c}</span>`).join('')}
                                </div>
                                
                                <p class="card-text text-secondary small flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                                    ${o.descripcion}
                                </p>
                                
                                <button class="btn btn-outline-primary w-100 mt-2 fw-medium" onclick="viewOfertaDetails(${o.id})">
                                    <i class="bi bi-eye me-1"></i>Ver Detalles
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function viewOfertaDetails(id) {
            try {
                const res = await fetch(`/api/ofertas/${id}`);
                const data = await res.json();
                if (data.success) {
                    const o = data.data;
                    document.getElementById('detail-title').textContent = o.titulo;
                    document.getElementById('detail-empresa').textContent = o.nombre_empresa;
                    document.getElementById('detail-reclutador').textContent = (o.reclutador_nombre || 'Desconocido') + (o.reclutador_email ? ` (${o.reclutador_email})` : '');
                    document.getElementById('detail-facultad').innerHTML = `<i class="bi bi-mortarboard-fill me-1"></i>${o.facultad_requerida || 'Todas'}`;
                    document.getElementById('detail-carreras-container').innerHTML = (o.carrera_requerida || []).map(c => `<span class="badge bg-light text-dark border border-secondary me-1"><i class="bi bi-book-fill me-1"></i>${c}</span>`).join('');
                    document.getElementById('detail-experiencia').textContent = o.experiencia_solicitada || 'No especificada';
                    document.getElementById('detail-habilidades').textContent = o.habilidades_requeridas || 'No especificadas';
                    document.getElementById('detail-descripcion').textContent = o.descripcion;
                    
                    const btnPostular = document.getElementById('btn-ir-postular');
                    if (user.rol === 'postulante') {
                        btnPostular.style.display = 'block';
                        btnPostular.onclick = () => window.location.href = `/postular?oferta_id=${id}`;
                    } else {
                        btnPostular.style.display = 'none'; // Reclutadores no postulan a sus propias ofertas
                    }

                    const modal = new bootstrap.Modal(document.getElementById('ofertaDetailsModal'));
                    modal.show();
                } else {
                    alert('No se pudo cargar los detalles de la oferta.');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }

        async function submitOferta() {
            const form = document.getElementById('create-oferta-form');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Obtener las carreras seleccionadas (múltiples)
            const carreraSelect = document.getElementById('new-carrera');
            const carrerasArray = Array.from(carreraSelect.selectedOptions).map(opt => opt.value);

            if (carrerasArray.length === 0) {
                alert('Debes seleccionar al menos una carrera.');
                return;
            }

            const payload = {
                usuario_id: user.id,
                titulo: document.getElementById('new-titulo').value,
                tipo: document.getElementById('new-tipo').value,
                facultad_requerida: document.getElementById('new-facultad').value,
                carrera_requerida: carrerasArray,
                descripcion: document.getElementById('new-descripcion').value,
                experiencia_solicitada: document.getElementById('new-experiencia').value,
                habilidades_requeridas: document.getElementById('new-habilidades').value
            };

            try {
                const res = await fetch('/api/ofertas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('createOfertaModal'));
                    modal.hide();
                    form.reset();
                    loadOfertas();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (e) {
                alert('Error de conexión');
            }
        }
    </script>
<script src="/navbar.js"></script>
<script>renderNavbar('vacantes');</script>
</body>
</html>
