events {
    worker_connections 1024;
}

# Proxy TCP (Capa 4) para PostgreSQL (Preservando la configuración de la VM1)
stream {
    upstream base_de_datos {
        server postgres-db:5432;
    }

    server {
        listen 5432;
        proxy_pass base_de_datos;
    }
}

# Proxy HTTP (Capa 7) y Balanceador hacia Microservicios
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Resolver DNS interno de Docker (permite balanceo dinámico en Swarm)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Upstreams hacia los microservicios
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        ip_hash; # Sesiones persistentes heredadas de la VM1
        server backend-core:3000;
    }

    upstream ia_upstream {
        server ia-service:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Microservicio de Inteligencia Artificial
        location /api/ia/ {
            proxy_pass http://ia_upstream/api/ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Microservicio Backend Core (API REST y WebSockets)
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            add_header X-Backend-Server $upstream_addr;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Soporte para WebSockets de Socket.io (Chat en tiempo real)
        location /socket.io/ {
            proxy_pass http://backend_upstream/socket.io/;
            add_header X-Backend-Server $upstream_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }

        # 3. Microservicio Frontend (Páginas Web, CSS, JS e imágenes)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
