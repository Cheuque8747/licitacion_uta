events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Evitar reescritura de redirecciones que rompan el puerto perimetral
    absolute_redirect off;

    upstream frontend_upstream {
        server 10.0.0.11:80 max_fails=2 fail_timeout=5s;
        server 10.0.0.12:80 max_fails=2 fail_timeout=5s;
    }

    upstream backend_upstream {
        ip_hash;
        server 10.0.0.11:3000 max_fails=2 fail_timeout=5s;
        server 10.0.0.12:3000 max_fails=2 fail_timeout=5s;
    }

    upstream ia_upstream {
        server 10.0.0.11:5001 max_fails=2 fail_timeout=5s;
        server 10.0.0.12:5001 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck perimetral
        location /health {
            return 200 'gateway ok';
            add_header Content-Type text/plain;
        }

        # Microservicio de IA
        location /api/ia/ {
            proxy_pass http://ia_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # WebSocket Socket.IO
        location /socket.io/ {
            proxy_pass http://backend_upstream/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Core API
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Web
        location / {
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
