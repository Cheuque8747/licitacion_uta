events {
    worker_connections 1024;
}

# Proxy TCP (Capa 4) para PostgreSQL hacia la VM4
stream {
    upstream base_de_datos {
        server 10.0.0.21:5432;
    }

    server {
        listen 5432;
        proxy_pass base_de_datos;
    }
}

# Proxy HTTP (Capa 7) y Balanceador hacia las Máquinas Virtuales VM2 y VM3
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Balanceo entre VM2 y VM3
    upstream frontend_upstream {
        server 10.0.0.11:80;
        server 10.0.0.12:80;
    }

    upstream backend_upstream {
        ip_hash; # Sesión pegajosa
        server 10.0.0.11:3000;
        server 10.0.0.12:3000;
    }

    upstream ia_upstream {
        server 10.0.0.11:5000;
        server 10.0.0.12:5000;
    }

    server {
        listen 80;
        server_name localhost;
        absolute_redirect off;

        # 1. Microservicio de Inteligencia Artificial
        location /api/ia/ {
            proxy_pass http://ia_upstream/api/ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Microservicio Backend Core (API REST y WebSockets)
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            add_header X-Backend-Server $upstream_addr;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Soporte para WebSockets de Socket.io (Chat en tiempo real)
        location /socket.io/ {
            proxy_pass http://backend_upstream/socket.io/;
            add_header X-Backend-Server $upstream_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }

        # 3. Microservicio Frontend (Páginas Web, CSS, JS e imágenes)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
