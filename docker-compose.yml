name: licitacion-uta

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  portainer_data:
    driver: local
  backup_data:
    driver: local

services:
  # ============================================================================
  # 1. GATEWAY PERIMETRAL (Punto de entrada único / Proxy inverso)
  # ============================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: licitacion-uta-gateway:1.0.0
    container_name: uta-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8888}:80"
      - "${GATEWAY_DB_PORT:-5433}:5432" # Stream TCP hacia la BD (evita colisión con VirtualBox)
    networks:
      - frontend_net
      - db_net
    depends_on:
      frontend:
        condition: service_healthy
      backend-core:
        condition: service_healthy
      ia-service:
        condition: service_healthy

  # ============================================================================
  # 2. MICROSERVICIO 1: FRONTEND (Interfaz de Usuario)
  # ============================================================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: licitacion-uta-frontend:1.0.0
    container_name: uta-frontend
    restart: unless-stopped
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/login"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 3. MICROSERVICIO 2: BACKEND CORE (Lógica de Negocio y WebSockets)
  # ============================================================================
  backend-core:
    build:
      context: ./src/backend-core
      dockerfile: Dockerfile
    image: licitacion-uta-backend-core:1.0.0
    container_name: uta-backend-core
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_USER=${DB_USER:-admin_proyecto}
      - DB_HOST=postgres-db
      - DB_NAME=${DB_NAME:-db_licitacion}
      - DB_PASSWORD=${DB_PASSWORD:-12345}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_uta_2024}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-tu_contrasena_redis}
      - IA_SERVICE_URL=http://ia-service:5000
    networks:
      - frontend_net
      - backend_net
      - db_net
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 4. MICROSERVICIO 3: INTELIGENCIA ARTIFICIAL (Google Gemini)
  # ============================================================================
  ia-service:
    build:
      context: ./src/ia-module
      dockerfile: Dockerfile
    image: licitacion-uta-ia-service:1.0.0
    container_name: uta-ia-service
    restart: unless-stopped
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 5. CACHÉ Y MENSAJERÍA: REDIS (Sesiones, WebSockets y Contexto)
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: uta-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-tu_contrasena_redis}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tu_contrasena_redis}", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 6. CAPA DE PERSISTENCIA: POSTGRESQL (Base de Datos Relacional)
  # ============================================================================
  postgres-db:
    image: postgres:18-alpine
    container_name: uta-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-admin_proyecto}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12345}
      - POSTGRES_DB=${DB_NAME:-db_licitacion}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./database/script_creacion.sql:/docker-entrypoint-initdb.d/01_script_creacion.sql:ro
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin_proyecto} -d ${DB_NAME:-db_licitacion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 7. OBSERVABILIDAD Y MONITOREO: PORTAINER CE
  # ============================================================================
  portainer:
    image: portainer/portainer-ce:2.27.1-alpine
    container_name: uta-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - frontend_net
