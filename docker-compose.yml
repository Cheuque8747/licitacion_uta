services:
  # 1. Gateway perimetral (Proxy inverso y enrutador unico)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: licitacion_gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    extra_hosts:
      - "frontend:${APP_HOST:-frontend}"
      - "backend-core:${APP_HOST:-backend-core}"
      - "ia-service:${APP_HOST:-ia-service}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
        required: false
      backend-core:
        condition: service_healthy
        required: false
      ia-service:
        condition: service_healthy
        required: false
    networks:
      - licitacion_net
    profiles:
      - all
      - gateway
    restart: unless-stopped

  # 2. Frontend web (Recursos estaticos y vistas)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: licitacion_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - licitacion_net
    profiles:
      - all
      - app
    restart: unless-stopped

  # 3. Backend Core (API REST, JWT, ATS y WebSockets)
  backend-core:
    build:
      context: ./src/backend-core
      dockerfile: Dockerfile
    # container_name omitido para permitir multiples replicas
    environment:
      - PORT=3000
      - DB_USER=${DB_USER}
      - DB_HOST=${DOCKER_DB_HOST:-postgres-db}
      - DB_HOST_REPLICA=${DB_HOST_REPLICA:-${DOCKER_DB_HOST:-postgres-db}}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-5432}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - IA_SERVICE_URL=http://${IA_HOST:-ia-service}:5001
    depends_on:
      postgres-db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    ports:
      - "${BACKEND_PORT:-3000}-3001:3000"
    deploy:
      replicas: 2
    networks:
      - licitacion_net
    profiles:
      - all
      - app
    restart: unless-stopped

  # 4. Microservicio IA (Google Gemini y compatibilidad laboral)
  ia-service:
    build:
      context: ./src/ia-module
      dockerfile: Dockerfile
    # container_name omitido para permitir multiples replicas
    environment:
      - PORT=5001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "${IA_PORT:-5001}-5002:5001"
    deploy:
      replicas: 2
    networks:
      - licitacion_net
    profiles:
      - all
      - app
    restart: unless-stopped

  # 5. Redis (Sesiones, Adapter de Socket.io y memoria)
  redis:
    image: redis:7-alpine
    container_name: licitacion_redis
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    expose:
      - "6379"
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG;
        else
          redis-cli ping | grep PONG;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - licitacion_net
    profiles:
      - all
      - redis
    restart: unless-stopped

  # 6. Motor relacional PostgreSQL 18
  postgres-db:
    image: postgres:18-alpine
    container_name: licitacion_postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${GATEWAY_DB_PORT:-5432}:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin_proyecto} -d ${DB_NAME:-db_licitacion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitacion_net
    profiles:
      - all
      - db
    restart: unless-stopped

  # 7. Panel de observabilidad y monitoreo Portainer (VM1)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: licitacion_portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - licitacion_net
    profiles:
      - all
      - monitoring
    restart: unless-stopped

networks:
  licitacion_net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  portainer_data:
    driver: local
